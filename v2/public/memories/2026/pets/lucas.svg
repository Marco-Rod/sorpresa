<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 130" aria-label="Lucas, pug cafecito"><style>.pet-shadow{fill:rgba(18,7,14,.18)}.pet-eye{fill:#2a1716}.pet-nose{fill:#24191c}.pet-leg{fill:none;stroke:#9a694c;stroke-width:10;stroke-linecap:round}.pet-blink{fill:none;stroke:#2a1716;stroke-width:2.4;opacity:0;}.pet-tail{fill:none;stroke-linecap:round;transform-origin:center;}.pet-breathe{transform-origin:50% 100%;}
@keyframes petBreathe{50%{transform:scaleY(.975) translateY(2px)}}@keyframes petBlink{0%,45%,49%,100%{opacity:0}46%,48%{opacity:1}}@keyframes petTail{to{transform:rotate(8deg)}}
/* Lucas: pug cafecito uniforme + barbita */
.lucas-body,.lucas-head{fill:#b6815d}.lucas-ear{fill:#76513f}.lucas-muzzle{fill:#c79a78}.lucas-beard-patch{fill:#765548;opacity:.42}.lucas-beard{fill:none;stroke:#68483f;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.lucas-tail{stroke:#956548;stroke-width:10}.pet-lucas .pet-leg{stroke:#a87352}.pet-lucas{}@keyframes lucasHappy{to{margin-bottom:3px}}
/* Lupe: cuerpo alargado rojizo, blanco y orejas grandes */
.lupe-body,.lupe-head{fill:#b95f3e}.lupe-ear{fill:#9d4935;transform-origin:50% 30%;}.lupe-white{fill:#f4e9df}.lupe-tail{stroke:#a74f38;stroke-width:8;animation-duration:.38s}.pet-lupe .pet-leg{stroke:#a84f38}@keyframes lupeEars{to{transform:rotate(3deg)}}
/* Max: atigrado oscuro, pecho/hocico blanco, nariz negra y ojos verde marino */
.max-body,.max-head{fill:#514d47}.max-chest,.max-face-white{fill:#f1eee7}.max-stripe{fill:none;stroke:#292c2a;stroke-width:5;stroke-linecap:round}.max-tail{stroke:#45443f;stroke-width:12;animation-duration:2.7s}.max-eye{fill:#397d70;stroke:#163f3a;stroke-width:1.5}.max-whiskers{fill:none;stroke:#e9e5df;stroke-width:1.4;stroke-linecap:round}.pet-max .pet-breathe{animation-duration:4.4s}
</style><g class="pet-breathe"><ellipse class="pet-shadow" cx="76" cy="116" rx="48" ry="8"/><ellipse class="lucas-body" cx="77" cy="83" rx="40" ry="34"/><circle class="lucas-head" cx="73" cy="48" r="36"/><path class="lucas-ear" d="M42 28 Q25 24 33 53 Q39 59 48 49Z"/><path class="lucas-ear" d="M102 27 Q119 25 111 53 Q104 58 96 48Z"/><ellipse class="lucas-muzzle" cx="73" cy="61" rx="23" ry="18"/><circle class="pet-eye" cx="59" cy="45" r="4"/><circle class="pet-eye" cx="87" cy="45" r="4"/><path class="pet-blink" d="M54 45 Q59 49 64 45 M82 45 Q87 49 92 45"/><ellipse class="pet-nose" cx="73" cy="57" rx="7" ry="5"/><path class="lucas-beard-patch" d="M56 67 Q61 73 64 80 Q68 77 72 84 Q76 78 80 83 Q83 76 90 68 Q82 76 73 76 Q64 76 56 67Z"/><path class="lucas-beard" d="M57 68 Q73 78 89 68 M59 72 Q62 77 60 81 M64 74 Q66 80 65 84 M69 76 Q70 82 70 86 M74 76 Q74 82 75 87 M79 75 Q78 81 80 85 M84 73 Q82 78 85 82 M88 70 Q86 75 90 78"/><path class="pet-tail lucas-tail" d="M111 82 Q137 67 126 91 Q118 101 111 91"/><path class="pet-leg" d="M52 98 V117 M93 99 V117"/></g></svg>