<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" aria-label="Lupe, perrita rojiza y blanca"><style>.pet-shadow{fill:rgba(18,7,14,.18)}.pet-eye{fill:#2a1716}.pet-nose{fill:#24191c}.pet-leg{fill:none;stroke:#9a694c;stroke-width:10;stroke-linecap:round}.pet-blink{fill:none;stroke:#2a1716;stroke-width:2.4;opacity:0;}.pet-tail{fill:none;stroke-linecap:round;transform-origin:center;}.pet-breathe{transform-origin:50% 100%;}
@keyframes petBreathe{50%{transform:scaleY(.975) translateY(2px)}}@keyframes petBlink{0%,45%,49%,100%{opacity:0}46%,48%{opacity:1}}@keyframes petTail{to{transform:rotate(8deg)}}
/* Lucas: pug cafecito uniforme + barbita */
.lucas-body,.lucas-head{fill:#b6815d}.lucas-ear{fill:#76513f}.lucas-muzzle{fill:#c79a78}.lucas-beard-patch{fill:#765548;opacity:.42}.lucas-beard{fill:none;stroke:#68483f;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.lucas-tail{stroke:#956548;stroke-width:10}.pet-lucas .pet-leg{stroke:#a87352}.pet-lucas{}@keyframes lucasHappy{to{margin-bottom:3px}}
/* Lupe: cuerpo alargado rojizo, blanco y orejas grandes */
.lupe-body,.lupe-head{fill:#b95f3e}.lupe-ear{fill:#9d4935;transform-origin:50% 30%;}.lupe-white{fill:#f4e9df}.lupe-tail{stroke:#a74f38;stroke-width:8;animation-duration:.38s}.pet-lupe .pet-leg{stroke:#a84f38}@keyframes lupeEars{to{transform:rotate(3deg)}}
/* Max: atigrado oscuro, pecho/hocico blanco, nariz negra y ojos verde marino */
.max-body,.max-head{fill:#514d47}.max-chest,.max-face-white{fill:#f1eee7}.max-stripe{fill:none;stroke:#292c2a;stroke-width:5;stroke-linecap:round}.max-tail{stroke:#45443f;stroke-width:12;animation-duration:2.7s}.max-eye{fill:#397d70;stroke:#163f3a;stroke-width:1.5}.max-whiskers{fill:none;stroke:#e9e5df;stroke-width:1.4;stroke-linecap:round}.pet-max .pet-breathe{animation-duration:4.4s}
</style><g class="pet-breathe"><ellipse class="pet-shadow" cx="92" cy="108" rx="62" ry="7"/><ellipse class="lupe-body" cx="101" cy="76" rx="57" ry="25"/><circle class="lupe-head" cx="48" cy="59" r="30"/><path class="lupe-ear lupe-ear-left" d="M31 35 Q7 36 13 75 Q25 83 38 63Z"/><path class="lupe-ear lupe-ear-right" d="M63 34 Q89 34 82 75 Q70 82 58 62Z"/><path class="lupe-white" d="M39 45 Q50 36 58 47 L61 73 Q48 83 36 71Z"/><circle class="pet-eye" cx="38" cy="56" r="3.8"/><circle class="pet-eye" cx="58" cy="56" r="3.8"/><ellipse class="pet-nose" cx="48" cy="68" rx="5.5" ry="4"/><path class="pet-tail lupe-tail" d="M153 70 Q174 48 174 67"/><path class="pet-leg" d="M70 91 V108 M130 91 V108"/></g></svg>